<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>แก๊งเด็กบ้านนา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="screen">
  <canvas id="game" width="240" height="160"></canvas>
  <div id="clock"></div>
  <div id="toast"></div>
  <div id="title">
    <canvas id="title-bg" width="240" height="160"></canvas>
    <div class="title-cloth"></div>
    <div class="title-logo"><span class="title-pre">ผจญภัยผีสางทุ่งอีสาน</span><h1>แก๊งเด็กบ้านนา</h1><p>บี · แอม · เติ้ล · เต๋อ</p></div>
    <div class="title-kids"><canvas width="16" height="16" data-kid="bee"></canvas><canvas width="16" height="16" data-kid="am"></canvas><canvas width="16" height="16" data-kid="tle"></canvas><canvas width="16" height="16" data-kid="ter"></canvas></div>
  </div>
  <div id="labels" hidden></div>
  <div id="quest" hidden></div>
  <button id="talk" hidden></button>
  <div id="hud" hidden>
    <div id="party-hud" aria-label="สมาชิกแก๊ง"></div>
    <canvas id="minimap" width="2" height="2" title="เปิดแผนที่ใหญ่ (M)"></canvas>
    <div id="hud-btns"><button data-act="bag">กระเป๋า<kbd>B</kbd></button><button data-act="team">ทีม<kbd>T</kbd></button><button data-act="map">แผนที่<kbd>M</kbd></button><button data-act="menu">เมนู<kbd>Enter</kbd></button></div>
  </div>
  <div id="ui"></div>
  <div id="fade"></div>
</div>
<div id="pad" aria-hidden="true">
  <div class="dpad"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="down">▼</button></div>
  <div class="abtn"><button data-key="menu" class="small">เมนู</button><button data-key="back">X</button><button data-key="ok">Z</button></div>
</div>
<script src="js/data.js"></script>
<script src="js/formulas.js"></script>
<script src="js/battle.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/world.js"></script>
<script src="js/battleui.js"></script>
<script src="js/story.js"></script>
<script src="js/guide.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
<script>document.querySelectorAll('[data-kid]').forEach(function (c) { var x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(G.sprite(c.dataset.kid), 0, 0); });</script>
</body>
</html>
